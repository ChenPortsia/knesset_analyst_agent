[project]
name = "knesset"
version = "0.0.0"
description = "Knesset data platform: database, enrichment and multi-agent analysis"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.10.0",
    "arize-phoenix-otel",
    "asyncpg",
    "dbt-postgres>=1.11.0",
    "httpx[http2]",
    "langchain>=1.5.2",
    "langchain-anthropic>=1.7.12",
    "langchain-core>=1.8.4",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-postgres>=3.2.1",
    "openinference-instrumentation-anthropic>=3.3.9",
    "pandas",
    "pgvector>=0.5.1",
    "psycopg[binary]",
    "pydantic-settings",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "structlog",
    "tokenizers>=0.23.3",
    "typer",
]

[project.optional-dependencies]
# Embedding runs natively where the GPU is: uv run --extra embed knesset embed
embed = ["sentence-transformers", "torch"]

[project.scripts]
knesset = "knesset.cli:app"

[dependency-groups]
dev = ["ipykernel", "jupyterlab", "jupytext", "nbconvert", "pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/knesset/tables_meta.py"]  # copied verbatim (MIT)

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = ["E402", "B018", "F704"]  # cell imports, bare display, top-level await

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.jupytext]
formats = "ipynb,py:percent"
