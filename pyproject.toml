[project]
name = "knesset"
version = "0.0.0"
description = "Knesset data platform: database, enrichment and multi-agent analysis"
requires-python = ">=3.12,<3.13"
dependencies = [
    "arize-phoenix-otel",
    "httpx",
    "pandas",
    "psycopg[binary]",
    "pydantic-settings",
    "structlog",
    "typer",
]

[project.optional-dependencies]
gpu = ["torch"]

[project.scripts]
knesset = "knesset.cli:app"

[dependency-groups]
dev = ["ipykernel", "jupyterlab", "jupytext", "nbconvert", "pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = ["E402", "B018"]  # cell-style imports and bare display expressions

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.jupytext]
formats = "ipynb,py:percent"
