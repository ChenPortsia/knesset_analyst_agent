name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  stack:
    # Clean-clone acceptance check on Linux: build images, start the stack, run status + notebook 00.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: make up
      - run: make status
      - run: uv sync --locked && uv run knesset status
      - run: make notebooks
      - if: failure()
        run: docker compose logs --tail 200
