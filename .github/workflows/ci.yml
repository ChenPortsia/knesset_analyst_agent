name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: knesset
          POSTGRES_PASSWORD: change-me-postgres
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Init database (roles, schemas)
        run: psql -v ON_ERROR_STOP=1 -f sql/000_init.sql
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: change-me-postgres
          PGDATABASE: knesset
          ETL_PASSWORD: change-me-etl
          AGENT_RO_PASSWORD: change-me-agent
          UI_APP_PASSWORD: change-me-ui
          PHOENIX_DB_PASSWORD: change-me-phoenix
      - run: uv run pytest -q -rs

  stack:
    # Clean-clone acceptance check on Linux: build images, start the stack, run status + notebook 00.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: make up
      - run: make status
      - run: uv sync --locked && uv run knesset status
      - run: uv run jupytext --to ipynb --execute notebooks/00_setup.py  # 01+ need an Israeli IP
      - if: failure()
        run: docker compose logs --tail 200
