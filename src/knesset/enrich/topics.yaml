# Topic taxonomy for chunk labeling (PLAN.md §10 Phase 5, step 4). DRAFT for user review.
# Seeded from KNS_IsraelLawClassificiation (the Knesset's 51 law classifications) and the
# committees of Knessets 25–26. Two levels: parents (ids 10, 20, …) and topics under them.
# Chunks are labeled with 1–3 topics (child ids). Edit freely; reload with `knesset topics`.
# `covers` notes which law classifications / committees a topic absorbs.

